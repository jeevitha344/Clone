version: 0.0
os: linux

files:
  - source: /
    destination: /home/ec2-user/flask-app

permissions:
  - object: /home/ec2-user/flask-app
    owner: ec2-user
    group: ec2-user

hooks:

  BeforeInstall:
    - location: scripts/install_dependencies.sh
      timeout: 300
      runas: root

  ApplicationStop:
    - location: scripts/stop.sh
      timeout: 300
      runas: root

  ApplicationStart:
    - location: scripts/start.sh
      timeout: 300
      runas: ec2-user